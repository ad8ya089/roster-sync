services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roster}
      POSTGRES_DB: ${POSTGRES_DB:-rostersync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/rostersync?reWriteBatchedInserts=true}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      - appdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s

  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [monitoring]
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=7d']
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ['127.0.0.1:9090:9090']
    depends_on:
      app: {condition: service_healthy}
    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.3.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    entrypoint:
      - /bin/sh
      - -ec
      - |
        test -n "$$GF_SECURITY_ADMIN_PASSWORD" || { echo 'Set GRAFANA_ADMIN_PASSWORD in .env'; exit 1; }
        exec /run.sh
    ports: ['127.0.0.1:3000:3000']
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/roster-sync.json:/var/lib/grafana/dashboards/roster-sync.json:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
  prometheus-data:
  grafana-data:
