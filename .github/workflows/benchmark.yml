name: Weekly and manual benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # Monday 03:00 UTC / 08:30 IST

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify and collect bounded-heap benchmark evidence
        run: ./mvnw -B verify -Pbenchmark
      - name: Upload test and benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/benchmark-reports/
            target/phase8-benchmark.json
            target/phase8-throughput-current.json
          if-no-files-found: warn
